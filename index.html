  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100%;color:var(--text);}
  header{padding:18px 16px 10px;text-align:center;color:#fff;}
  header h1{font-family:var(--font-h);margin:0;font-size:1.4rem;letter-spacing:.3px;}
  .who{max-width:520px;margin:10px auto 0;padding:0 16px;}
  select{width:100%;padding:12px 14px;border-radius:12px;border:none;font-size:1rem;font-family:var(--font);background:#fff;}
  .tabs{display:flex;gap:8px;max-width:520px;margin:14px auto 0;padding:0 16px;}
  .tab{flex:1;padding:10px;text-align:center;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;cursor:pointer;font-size:.92rem;}
  .tab.active{background:#fff;color:var(--accent-dark);}
  main{max-width:520px;margin:0 auto;padding:16px 16px 90px;}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.15);}
  .card h3{margin:0 0 4px;font-family:var(--font-h);font-size:1.05rem;}
  .card .meta{color:var(--muted);font-size:.85rem;margin-bottom:10px;}
  .btnrow{display:flex;gap:8px;margin-bottom:10px;}
  .btn{flex:1;padding:9px;border-radius:10px;border:2px solid #e2e6e3;background:var(--card-alt);font-weight:600;font-size:.88rem;cursor:pointer;color:var(--text);}
  .btn.present.active{background:var(--ok);border-color:var(--ok);color:#fff;}
  .btn.absent.active{background:var(--danger);border-color:var(--danger);color:#fff;}
  .list{font-size:.82rem;color:var(--muted);line-height:1.5;}
  .list b{color:var(--text);}
  .empty{text-align:center;color:rgba(255,255,255,.75);padding:30px 10px;font-size:.95rem;}
  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;background:#fff;border:none;font-size:1.3rem;box-shadow:0 6px 16px rgba(0,0,0,.3);cursor:pointer;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px;}
  .modal h3{font-family:var(--font-h);margin-top:0;}
  .modal label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px;}
  .modal input,.modal select{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;font-size:.95rem;font-family:var(--font);}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:#eee;color:var(--text);}
  .chip{display:inline-block;background:var(--card-alt);border-radius:8px;padding:2px 8px;margin:2px 3px 0 0;font-size:.78rem;}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){} }
</style>
</head>

<script>
// ====== CONFIG À REMPLIR ======
const SUPABASE_URL = "https://dwslnlldjbjhtjcyazag.supabase.co";

const PLAYERS = ["Raphael","Flo","Gaspard","Alexandre C","Manu","Mathieu","Nasser","Franck","Kamel","Miguel","Abdel","Alexandre B","Thomas","Moises","Tarek","Sébastien","Dogan","Ben","Alexis"];
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const SLOTS = [{key:"18-19",label:"18h - 19h"},{key:"19-20",label:"19h - 20h"},{key:"20-21",label:"20h - 21h"}];
const MORNING_SLOTS = [{key:"10-11",label:"10h - 11h"},{key:"11-12",label:"11h - 12h"}];
function slotsForDay(dayIdx){ return (dayIdx===5||dayIdx===6) ? [...MORNING_SLOTS, ...SLOTS] : SLOTS; }
const VALID_THRESHOLD = 5;

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentTab = "matchs";
let currentWeek = "this"; // "this" ou "next"
let isAdmin = false;
let me = localStorage.getItem('foot_player') || '';

const nameGrid = document.getElementById('nameGrid');
nameGrid.innerHTML = PLAYERS.map(p=>`<button class="btn" style="padding:12px" onclick="choosePlayer('${p.replace(/'/g,"\\'")}')">${p}</button>`).join('');

function choosePlayer(p){
  me = p; localStorage.setItem('foot_player', p);
  showApp();
}
document.getElementById('changeNameBtn').onclick = (e)=>{ e.preventDefault(); me=''; localStorage.removeItem('foot_player'); showNameScreen(); };

function showNameScreen(){
  document.getElementById('nameScreen').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('whoBar').style.display = 'none';
  document.getElementById('tabsBar').style.display = 'none';
  document.getElementById('adminBtn').style.display = 'none';
}
function showApp(){
  document.getElementById('nameScreen').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('whoBar').style.display = 'block';
  document.getElementById('tabsBar').style.display = 'flex';
  document.getElementById('adminBtn').style.display = 'block';
  document.getElementById('whoName').textContent = me;
  render();
}
function getMonday(d){ d=new Date(d); const day=d.getDay(); const diff=(day===0?-6:1-day); d.setDate(d.getDate()+diff); d.setHours(0,0,0,0); return d; }
function isoDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
const THIS_MONDAY = getMonday(new Date());
const NEXT_MONDAY = new Date(THIS_MONDAY); NEXT_MONDAY.setDate(THIS_MONDAY.getDate()+7);
const WEEK_ID = { this: isoDate(THIS_MONDAY), next: isoDate(NEXT_MONDAY) };

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); currentTab = t.dataset.tab;
  document.getElementById('adminBtn').style.display = currentTab==='matchs' ? 'block' : 'none';
  render();
});

function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').onclick = e=>{ if(e.target.id==='overlay') closeModal(); };

document.getElementById('adminBtn').onclick = ()=>{
  if(isAdmin){ openAddMenu(); return; }
  const modal = document.getElementById('modalBody');
  modal.innerHTML = `<h3>Code admin</h3><input id="codeInput" type="password" placeholder="Code"><div class="modal-actions">
    <button class="btn-secondary" onclick="closeModal()">Annuler</button>
    <button class="btn-primary" id="okCode">Valider</button></div>`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('okCode').onclick = ()=>{
    if(document.getElementById('codeInput').value === ADMIN_CODE){ isAdmin = true; closeModal(); openAddMenu(); }
    else alert("Code incorrect");
  };
};

function openAddMenu(){ openAddMatch(); }

function openAddMatch(){
  const modal = document.getElementById('modalBody');
  modal.innerHTML = `<h3>Ajouter un match</h3>
    <label>Date</label><input id="mDate" type="date">
    <label>Adversaire</label><input id="mOpp" type="text">
    <label>Lieu</label><input id="mLoc" type="text">
    <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Annuler</button>
    <button class="btn-primary" id="saveMatch">Ajouter</button></div>`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('saveMatch').onclick = async ()=>{
    const d = document.getElementById('mDate').value;
    if(!d) return alert("Date requise");
    await sb.from('matches').insert({match_date:d, opponent:document.getElementById('mOpp').value, location:document.getElementById('mLoc').value});
    closeModal(); render();
  };
}

async function purgeOldWeeks(){
  await sb.from('training_votes').delete().lt('week_id', WEEK_ID.this);
}
async function purgeOldMatches(){
  await sb.from('matches').delete().lt('match_date', isoDate(new Date()));
}

async function render(){
  const main = document.getElementById('content');
  if(currentTab === 'matchs'){
    await purgeOldMatches();
    const {data: matches} = await sb.from('matches').select('*').order('match_date');
    const {data: avail} = await sb.from('match_availability').select('*');
    if(!matches || matches.length===0){ main.innerHTML = '<div class="empty">Aucun match programmé pour l\'instant.</div>'; return; }
    main.innerHTML = matches.map(m=>{
      const rows = (avail||[]).filter(a=>a.match_id===m.id);
      const mine = rows.find(a=>a.player===me);
      const present = rows.filter(a=>a.status==='present').map(a=>a.player);
      const absent = rows.filter(a=>a.status==='absent').map(a=>a.player);
      return `<div class="card">
        <h3>${m.opponent || 'Match'} </h3>
        <div class="meta">📅 ${fmtDate(m.match_date)}${m.location? ' · 📍 '+m.location:''}</div>
        <div class="btnrow">
          <button class="btn present ${mine&&mine.status==='present'?'active':''}" onclick="setAvail('${m.id}','present')">✅ Présent</button>
          <button class="btn absent ${mine&&mine.status==='absent'?'active':''}" onclick="setAvail('${m.id}','absent')">❌ Absent</button>
        </div>
        <div class="list"><b>Présents (${present.length}) :</b> ${present.join(', ')||'—'}<br><b>Absents (${absent.length}) :</b> ${absent.join(', ')||'—'}</div>
      </div>`;
    }).join('');
  } else {
    await purgeOldWeeks();
    const weekId = WEEK_ID[currentWeek];
    const weekMonday = currentWeek==='this' ? THIS_MONDAY : NEXT_MONDAY;
    const {data: votes} = await sb.from('training_votes').select('*').eq('week_id', weekId);
    const {data: matches} = await sb.from('matches').select('match_date');
    const matchDates = new Set((matches||[]).map(m=>m.match_date));
    const sub = `<div class="tabs" style="margin:0 0 14px;">
      <div class="tab ${currentWeek==='this'?'active':''}" onclick="switchWeek('this')">Cette semaine</div>
      <div class="tab ${currentWeek==='next'?'active':''}" onclick="switchWeek('next')">Semaine prochaine</div>
    </div>
    <p style="color:rgba(255,255,255,.85);font-size:.85rem;text-align:center;margin:-6px 0 14px;">À partir de ${VALID_THRESHOLD} joueurs, le créneau est considéré comme validé ✅</p>`;
    const todayIso = isoDate(new Date());
    const cards = DAYS.map((day, dayIdx)=>{
      const dayDate = new Date(weekMonday); dayDate.setDate(dayDate.getDate()+dayIdx);
      const dayIso = isoDate(dayDate);
      if(dayIso < todayIso) return '';
      if(matchDates.has(dayIso)){
        return `<div class="card"><h3>${day}</h3><div class="meta">⚽ Match ce jour-là — pas d'entraînement</div></div>`;
      }
      const slotsHtml = slotsForDay(dayIdx).map(s=>{
        const v = (votes||[]).filter(x=>x.day===dayIdx && x.slot===s.key);
        const names = v.map(x=>x.player);
        const iVoted = names.includes(me);
        const validated = names.length >= VALID_THRESHOLD;
        return `<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #eee;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <b style="font-size:.92rem;">${s.label}</b>
            <button class="btn present ${iVoted?'active':''}" style="flex:none;padding:6px 12px;" onclick="toggleVote(${dayIdx},'${s.key}',${iVoted})">${iVoted?'✅ Dispo':'☐ Dispo ?'}</button>
          </div>
          <div class="list">${names.length} joueur(s)${validated?' · <b style=\"color:var(--ok)\">Validé ✅</b>':''} : ${names.join(', ')||'—'}</div>
        </div>`;
      }).join('');
      return `<div class="card"><h3>${day}</h3>${slotsHtml}</div>`;
    }).join('');
    main.innerHTML = sub + cards;
  }
}

function switchWeek(w){ currentWeek = w; render(); }

function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('fr-FR',{weekday:'short', day:'numeric', month:'short'});
}

async function setAvail(matchId, status){
  await sb.from('match_availability').upsert({match_id:matchId, player:me, status});
  render();
}

async function toggleVote(dayIdx, slotKey, currentlyIn){
  const weekId = WEEK_ID[currentWeek];
  if(currentlyIn){ await sb.from('training_votes').delete().eq('week_id', weekId).eq('day', dayIdx).eq('slot', slotKey).eq('player', me); }
  else{ await sb.from('training_votes').insert({week_id: weekId, day: dayIdx, slot: slotKey, player: me}); }
  render();
}

if(me) showApp(); else showNameScreen();
</script>
</body>
</html>
